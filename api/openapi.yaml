openapi: 3.0.3
info:
  title: Portfolio Tracker API
  version: 1.0.0
  description: >-
    Current implemented contract. Future portfolio, instrument, position, pricing,
    cash and corporate-action routes are not yet published as callable operations.
servers:
  - url: http://localhost:8105
paths:
  /v1/portfolios/{id}/trades:
    post:
      operationId: recordTrade
      summary: Record a portfolio trade
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeRequest'
      responses:
        '201':
          description: Trade accepted; response body is empty.
        '400':
          description: Invalid portfolio UUID, malformed JSON, or repository/domain error.
  /v1/portfolios/{id}/summary:
    get:
      operationId: getPortfolioSummary
      summary: Get portfolio summary
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: Portfolio positions and currently-zero market figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
        '400':
          description: Invalid portfolio UUID.
        '500':
          description: Query failure.
  /v1/portfolios/{id}/positions/{symbol}:
    get:
      operationId: getPositionValuation
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: currency
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: as_of
          in: query
          required: true
          description: Unix timestamp seconds defining valuation cutoff.
          schema: { type: integer, format: int64 }
        - name: max_age
          in: query
          required: true
          description: Maximum accepted price age in seconds.
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Exact position basis and as-of valuation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionValuation' }
        '400': { description: Invalid ID, currency, price or query. }
  /v1/portfolios/{id}/positions/{symbol}/trades:
    post:
      operationId: recordAccountingTrade
      description: >-
        In-memory accounting path, separate from the legacy trades/summary store.
        A nonempty Idempotency-Key header or idempotency_key body field is required;
        if both are supplied they must match. Replays return the original position
        snapshot without another effect. Keys are global to this accounting trade store.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/PortfolioId'
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side, quantity, price]
              properties:
                side: { type: string, enum: [BUY, SELL] }
                quantity: { type: string }
                price: { type: string }
                idempotency_key: { type: string, minLength: 1 }
      responses:
        '201': { description: Accounting trade accepted or same-payload replay; original position snapshot returned. }
        '400': { description: Invalid request, missing/disagreeing key or rejected oversell. }
        '409': { description: Key reused with a different portfolio, symbol, side, quantity or price. }
  /v1/portfolios/{id}/cash:
    get:
      operationId: getCashBalance
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - name: currency
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '200': { description: Local portfolio cash balance. }
        '400': { description: Invalid ID or currency. }
  /v1/portfolios/{id}/cash/fund:
    post:
      operationId: fundCash
      parameters: [{ $ref: '#/components/parameters/PortfolioId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashMovement' }
      responses:
        '200': { description: Funding accepted; returns local balance. }
        '400': { description: Invalid request. }
        '409': { description: Idempotency conflict or insufficient cash. }
  /v1/portfolios/{id}/cash/withdraw:
    post:
      operationId: withdrawCash
      parameters: [{ $ref: '#/components/parameters/PortfolioId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashMovement' }
      responses:
        '200': { description: Withdrawal accepted; returns local balance. }
        '400': { description: Invalid request. }
        '409': { description: Idempotency conflict or insufficient cash. }
components:
  parameters:
    PortfolioId:
      name: id
      in: path
      required: true
      description: UUID identifying the portfolio.
      schema:
        type: string
        format: uuid
  schemas:
    TradeRequest:
      type: object
      required: [symbol, side, quantity, price]
      properties:
        symbol: { type: string }
        side: { type: string, description: Legacy behavior accepts any side; BUY and SELL update positions. }
        quantity: { type: string, example: '2.5', description: Decimal quantity encoded as a JSON decimal string. }
        price: { type: string, example: '10.25', description: Decimal price encoded as a JSON decimal string. }
        idempotency_key: { type: string, description: Optional legacy key; repeated keys return 400. }
    Position:
      type: object
      properties:
        Symbol: { type: string }
        Quantity: { type: string }
        AverageCost: { type: string }
        RealizedPnL: { type: string }
    PositionValuation:
      type: object
      required: [symbol, quantity, cost_basis, realized_pnl, market_value, unrealized_pnl, currency, price_as_of]
      properties:
        symbol: { type: string }
        quantity: { type: string }
        cost_basis: { type: string }
        realized_pnl: { type: string }
        market_value: { type: string }
        unrealized_pnl: { type: string }
        currency: { type: string }
        price_as_of: { type: integer, format: int64 }
    CashMovement:
      type: object
      required: [currency, amount, idempotency_key]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        amount: { type: string, example: '25.00' }
        idempotency_key: { type: string, minLength: 1 }
    PortfolioSummary:
      type: object
      properties:
        TotalValue: { type: string, example: '0' }
        UnrealizedPnL: { type: string, example: '0' }
        Positions:
          type: array
          items: { $ref: '#/components/schemas/Position' }
