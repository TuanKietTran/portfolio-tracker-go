openapi: 3.0.3
info:
  title: Portfolio Tracker API
  version: 1.0.0
  description: >-
    Current production-router contract. Trades and summary share accounting state.
    Cash remains a local simulation; trades atomically update holdings and cash.
    Instrument/pricing management, corporate-action and returns routes are not yet callable.
    The original in-process playback exercises a separate legacy compatibility adapter.
    All production responses include X-Request-ID. Errors use the Error schema;
    common runtime errors are 404 (route), 405 (method) and 500 (panic before response).
    Mutation bodies are limited to 16384 bytes; unknown JSON fields and trailing values
    are rejected with 400, oversized bodies with 413. Keys must be nonblank and at
    most 200 bytes. HTTP_ADDR defaults to :8105, CASH_MODE supports local only,
    COST_METHOD selects FIFO (default) or AVERAGE_COST. PAYMENTS_URL and DATABASE_URL
    fail startup until their adapters are implemented.
servers:
  - url: http://localhost:8105
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200': { description: Process healthy; reports local cash mode and memory store. }
  /readyz:
    get:
      operationId: readiness
      description: Local simulation initialized; does not promise downstream availability, durable storage or price coverage.
      responses:
        '200': { description: Local simulation ready. }
        '503': { description: Local simulation uninitialized or readiness check failed. }
        '500': { description: Recovered readiness panic; no private details returned. }
  /metrics:
    get:
      operationId: metrics
      responses:
        '200':
          description: Per-router process-lifetime counters, including this request; counters reset on restart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: { type: integer, format: int64 }
                  errors: { type: integer, format: int64 }
                  panics: { type: integer, format: int64 }
  /v1/portfolios/{id}/trades:
    post:
      operationId: recordTrade
      summary: Record a portfolio trade
      description: >-
        Same accounting store and replay rules as the position-specific trade route.
        BUY or SELL only; oversells and missing keys are rejected. Same-payload
        replay returns 201 without another effect. Currency is required; buys debit
        local cash and sells credit it atomically. Insufficient cash is 409.
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - name: Idempotency-Key
          in: header
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeRequest'
      responses:
        '201':
          description: Trade accepted; response body is empty.
        '400':
          description: Invalid request, missing/disagreeing key or rejected oversell.
        '409':
          description: Idempotency key payload conflict or insufficient local cash.
        '413': { description: Request body exceeds 16384 bytes. }
  /v1/portfolios/{id}/summary:
    get:
      operationId: getPortfolioSummary
      summary: Get marked portfolio summary from the shared holdings snapshot
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - $ref: '#/components/parameters/ValuationCurrency'
        - $ref: '#/components/parameters/ValuationAsOf'
        - $ref: '#/components/parameters/ValuationMaxAge'
      responses:
        '200':
          description: Symbol-sorted positions and actual marked totals. Existing PascalCase response fields retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
        '400':
          description: Invalid UUID/query/currency, unavailable price, stale price or query failure.
  /v1/portfolios/{id}/positions/{symbol}:
    get:
      operationId: getPositionValuation
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: currency
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: as_of
          in: query
          required: true
          description: Unix timestamp seconds defining valuation cutoff.
          schema: { type: integer, format: int64 }
        - name: max_age
          in: query
          required: true
          description: Maximum accepted price age in seconds.
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Exact position basis and as-of valuation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionValuation' }
        '400': { description: Invalid ID, currency, price or query. }
  /v1/portfolios/{id}/positions/{symbol}/trades:
    post:
      operationId: recordAccountingTrade
      description: >-
        In-memory accounting path, sharing the production trades/summary store.
        A nonempty Idempotency-Key header or idempotency_key body field is required;
        if both are supplied they must match. Replays return the original position
        snapshot without another effect. Keys are global to this accounting trade store. Currency is required and
        fixed for each symbol by its first successful trade. Quantities/prices use
        at most 30 coefficient digits and exponent -18 through 18. Notionals must
        settle exactly in minor units (USD/EUR/GBP 2, JPY 0); fractional minor units
        are rejected, never silently rounded. Cost method is immutable per position.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/PortfolioId'
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side, quantity, price, currency]
              properties:
                currency: { type: string, enum: [USD, EUR, GBP, JPY] }
                side: { type: string, enum: [BUY, SELL] }
                quantity: { type: string }
                price: { type: string }
                idempotency_key: { type: string, minLength: 1 }
      responses:
        '201': { description: Accounting trade accepted or same-payload replay; original position snapshot returned. }
        '400': { description: Invalid request, missing/disagreeing key or rejected oversell. }
        '409': { description: Insufficient cash or key reused with a different portfolio, symbol, currency, side, quantity or price. }
        '413': { description: Request body exceeds 16384 bytes. }
  /v1/portfolios/{id}/cash:
    get:
      operationId: getCashBalance
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - name: currency
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '200': { description: Local portfolio cash balance. }
        '400': { description: Invalid ID or currency. }
  /v1/portfolios/{id}/cash/fund:
    post:
      operationId: fundCash
      description: Local cash simulation only; external payment configuration is rejected at startup.
      parameters:
        - { $ref: '#/components/parameters/PortfolioId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashMovement' }
      responses:
        '200': { description: Funding accepted; returns original balance result on replay. }
        '400': { description: Invalid request. }
        '413': { description: Request body exceeds 16384 bytes. }
        '409': { description: Idempotency conflict or insufficient cash. }
        '503': { description: Payment-backed cash boundary configured without safe recovery support; no transfer attempted. }
  /v1/portfolios/{id}/cash/withdraw:
    post:
      operationId: withdrawCash
      description: Local cash simulation only; insufficient funds cannot debit balance.
      parameters:
        - { $ref: '#/components/parameters/PortfolioId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashMovement' }
      responses:
        '200': { description: Withdrawal accepted; returns original balance result on replay. }
        '400': { description: Invalid request. }
        '413': { description: Request body exceeds 16384 bytes. }
        '409': { description: Idempotency conflict or insufficient cash. }
        '503': { description: Payment-backed cash boundary configured without safe recovery support; no transfer attempted. }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, minLength: 1 }
    ValuationCurrency:
      name: currency
      in: query
      required: true
      schema: { type: string, minLength: 3, maxLength: 3 }
    ValuationAsOf:
      name: as_of
      in: query
      required: true
      description: Positive Unix seconds defining valuation cutoff.
      schema: { type: integer, format: int64, minimum: 1 }
    ValuationMaxAge:
      name: max_age
      in: query
      required: true
      description: Non-negative maximum accepted price age in seconds.
      schema: { type: integer, format: int64, minimum: 0 }
    PortfolioId:
      name: id
      in: path
      required: true
      description: UUID identifying the portfolio.
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string, format: uuid }
    TradeRequest:
      type: object
      required: [symbol, side, quantity, price, currency]
      properties:
        symbol: { type: string }
        currency: { type: string, enum: [USD, EUR, GBP, JPY] }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: string, example: '2.5', description: Decimal quantity encoded as a JSON decimal string. }
        price: { type: string, example: '10.25', description: Decimal price encoded as a JSON decimal string. }
        idempotency_key: { type: string, minLength: 1, description: Required unless Idempotency-Key header is supplied; both must agree. }
    Position:
      type: object
      properties:
        Symbol: { type: string }
        Quantity: { type: string }
        AverageCost: { type: string }
        RealizedPnL: { type: string }
        CostBasis: { type: string }
        MarketValue: { type: string }
        UnrealizedPnL: { type: string }
        PriceAsOf: { type: integer, format: int64 }
    PositionValuation:
      type: object
      required: [symbol, quantity, cost_basis, realized_pnl, market_value, unrealized_pnl, currency, price_as_of]
      properties:
        symbol: { type: string }
        quantity: { type: string }
        cost_basis: { type: string }
        realized_pnl: { type: string }
        market_value: { type: string }
        unrealized_pnl: { type: string }
        currency: { type: string }
        price_as_of: { type: integer, format: int64 }
    CashMovement:
      type: object
      required: [currency, amount]
      description: >-
        Idempotency-Key header or body idempotency_key required; both must agree.
        Replay returns the original cash result without another effect. Keys are
        global within the cash store, separate from accounting-trade keys. Exact
        minor-unit amounts only (USD/EUR/GBP 2, JPY 0), with at most 30 coefficient
        digits and exponent -18 through 18; no implicit rounding or conversion.
      properties:
        currency: { type: string, enum: [USD, EUR, GBP, JPY] }
        amount: { type: string, example: '25.00' }
        idempotency_key: { type: string, minLength: 1 }
    PortfolioSummary:
      type: object
      properties:
        Currency: { type: string }
        AsOf: { type: integer, format: int64 }
        TotalValue: { type: string, example: '30' }
        UnrealizedPnL: { type: string, example: '10' }
        Positions:
          type: array
          items: { $ref: '#/components/schemas/Position' }
